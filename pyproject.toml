[project]
name = "fundrive-pan115"
version = "2.0.102"
description = "115网盘（p115client）云存储 API 封装"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "filelock>=3.16.0",
    "httpx>=0.27.0",
    "orjson>=3.10.0",
    "pycryptodome>=3.20.0",
    "qrcode>=7.4.0",
    "yarl>=1.15.0",
]

[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/fundrive-pan115"
Releases = "https://github.com/farfarfun/fundrive-pan115/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundrives"]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.14.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]

# ---------------------------------------------------------------------------
# 以下 select / ignore 是 fundrive 工作区各仓库**共用的基线**，逐字相同。
# 改动任何一条都要同步到全部仓库，否则 scripts/check-lint-baseline.sh 会拦截。
# 基线的取舍记录在 fundrive-dev 的 docs/project/project-governance/
# 004-known-deviations.md 第 6 条。
# ---------------------------------------------------------------------------
[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle 里真正是错误的那部分
    "F",               # pyflakes
    "I",               # import 排序
    "UP",              # 过时写法
    "B",               # bugbear
    "SIM",             # 可简化的写法
    "RET",             # return 路径
    "C4",              # 推导式与字面量
    "PLE",             # pylint 的 error 级
    "T100",            # 漏在代码里的 breakpoint()
    "S102",            # exec()
]
ignore = [
    "E501",
    "PLE1205",
]

[tool.ruff.lint.per-file-ignores]
# src/fundrives/pan115/ 为从上游 p115client 0.0.9.6.5.1 搬运的派生源码；
# 阶段 3 已修复 466 处安全风格问题并大幅收紧此处忽略项（移除了 I001/RET505/UP009/B009/B010/B012 等 19 条规则）。
"src/fundrives/pan115/**/*.py" = [
    "B006", "B007", "B008", "B018", "B020", "B023", "B028", "B035", "B905",
    "E402", "E722", "E731",
    "F401", "F403", "F841",
    "RET503",
    "SIM102", "SIM105", "SIM108", "SIM115",
    "UP031", "UP035",
]
"src/fundrives/pan115/_vendor/**/*.py" = [
    "B007", "B008", "B020", "B028", "B904", "B905",
    "E722", "E731", "E741",
    "F401", "F403", "F841",
    "RET503",
    "SIM102", "SIM105", "SIM108", "SIM109", "SIM110", "SIM115",
    "UP030", "UP031", "UP035", "UP047",
]
